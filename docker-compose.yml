version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - solar_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/solar_platform.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  solar_data:
